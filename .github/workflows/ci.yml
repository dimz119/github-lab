name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Actions 탭에서 main으로 수동 실행해 Deploy step을 시연할 수 있다
  workflow_dispatch:

jobs:
  # 이 이름이 PR 화면의 체크 이름이 된다
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # requirements.txt에 pytest가 들어 있어야 한다
      - run: pip install -r requirements.txt
      - run: python -m pytest

      # 시연용: 로그에 찍힌 secret 값은 ***로 가려진다는 것을 보여준다.
      # 실제 프로젝트에서는 secret을 echo하지 않는다 (값을 조금만 가공해도 가려지지 않는다).
      - name: Secret masking demo
        if: github.ref == 'refs/heads/main'
        run: echo "token is $FLY_API_TOKEN"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy
        # main에 merge된 뒤에만 배포 (PR에서는 skipped로 표시된다)
        if: github.ref == 'refs/heads/main'
        run: python deploy.py
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

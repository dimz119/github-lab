name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # 이 이름이 PR 화면의 체크 이름이 된다
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # requirements.txt에 pytest가 들어 있어야 한다
      - run: pip install -r requirements.txt
      - run: python -m pytest
